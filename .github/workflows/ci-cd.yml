name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm and Node.js
        # built-in install lacks frozen-lockfile control (pnpm/setup#10)
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Lint (Stylelint)
        run: pnpm lint:style

      - name: Type check (vue-tsc)
        run: pnpm lint:markup

      - name: Unit tests (styleguide)
        run: pnpm --filter @antsask/styleguide test

      - name: Unit tests (website)
        run: pnpm --filter @antsask/website test

      - name: Audit dependencies
        # ACCEPTED-RISK: Non-blocking, transitive dependency CVEs may not have fixes yet.
        # Review audit output regularly and update dependencies when patches are available.
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  lighthouse-budget:
    name: Lighthouse budget
    # Deliberately depends on nothing: runs concurrently with quality.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm and Node.js
        # built-in install lacks frozen-lockfile control (pnpm/setup#10)
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lighthouse CI (perf budget)
        run: pnpm perf:audit

      # Reuses the .output that perf:audit just built. Blocking: a draft URL reaching the
      # sitemap must fail the pipeline.
      - name: Verify sitemap (content URLs, no drafts)
        run: pnpm --filter @antsask/website verify:sitemap

  build:
    name: Build & Push
    needs: [quality, lighthouse-budget]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Lint Dockerfile (website)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile

      - name: Lint Dockerfile (styleguide)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: packages/styleguide/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image (website)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
            SENTRY_ENVIRONMENT=production
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            NUXT_PUBLIC_SENTRY_DSN=${{ vars.NUXT_PUBLIC_SENTRY_DSN }}
            NUXT_PUBLIC_UMAMI_SRC=${{ vars.NUXT_PUBLIC_UMAMI_SRC }}
            NUXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NUXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NUXT_PUBLIC_UMAMI_DOMAINS=${{ vars.NUXT_PUBLIC_UMAMI_DOMAINS }}

      - name: Extract metadata (styleguide)
        id: meta-styleguide
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-styleguide
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image (styleguide)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/styleguide/Dockerfile
          push: true
          tags: ${{ steps.meta-styleguide.outputs.tags }}
          labels: ${{ steps.meta-styleguide.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to Swarm
    needs: [quality, lighthouse-budget, build]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: /opt/stacks/${{ vars.APP_NAME }}/

      - name: Deploy to Docker Swarm
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          IMAGE_TAG: ${{ github.sha }}
          APP_NAME: ${{ vars.APP_NAME }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NUXT_PUBLIC_SENTRY_DSN: ${{ vars.NUXT_PUBLIC_SENTRY_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
          NUXT_PUBLIC_UMAMI_SRC: ${{ vars.NUXT_PUBLIC_UMAMI_SRC }}
          NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.NUXT_PUBLIC_UMAMI_WEBSITE_ID }}
          NUXT_PUBLIC_UMAMI_DOMAINS: ${{ vars.NUXT_PUBLIC_UMAMI_DOMAINS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,APP_NAME,APP_DOMAIN,GITHUB_REPOSITORY,NUXT_PUBLIC_SENTRY_DSN,SENTRY_RELEASE,NUXT_PUBLIC_UMAMI_SRC,NUXT_PUBLIC_UMAMI_WEBSITE_ID,NUXT_PUBLIC_UMAMI_DOMAINS
          script: |
            # Convert repository name to lowercase (Docker requirement)
            IMAGE_NAME="${GITHUB_REPOSITORY,,}"

            # Pull the new image
            docker pull "ghcr.io/${IMAGE_NAME}:${IMAGE_TAG}"

            # Export variables for docker-compose
            export IMAGE_TAG="${IMAGE_TAG}"
            export APP_NAME="${APP_NAME}"
            export APP_DOMAIN="${APP_DOMAIN}"
            export GITHUB_REPOSITORY="${IMAGE_NAME}"
            export NUXT_PUBLIC_SENTRY_DSN="${NUXT_PUBLIC_SENTRY_DSN}"
            export SENTRY_RELEASE="${SENTRY_RELEASE}"
            export NUXT_PUBLIC_UMAMI_SRC="${NUXT_PUBLIC_UMAMI_SRC}"
            export NUXT_PUBLIC_UMAMI_WEBSITE_ID="${NUXT_PUBLIC_UMAMI_WEBSITE_ID}"
            export NUXT_PUBLIC_UMAMI_DOMAINS="${NUXT_PUBLIC_UMAMI_DOMAINS}"

            # Deploy the stack (start-first for zero-downtime)
            docker stack deploy \
              --with-registry-auth \
              -c "/opt/stacks/${APP_NAME}/docker-compose.yml" \
              "${APP_NAME}"

            # Wait for deployment
            sleep 15

            # Verify deployment
            docker stack services "${APP_NAME}"

      - name: Verify deployment
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP_NAME: ${{ vars.APP_NAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_NAME
          script: |
            # Every service of the stack is checked, discovered dynamically so a
            # newly added one is covered without editing this workflow.
            SERVICES=$(docker stack services "${APP_NAME}" --format '{{.Name}}')

            if [[ -z "$SERVICES" ]]; then
              echo "No service found in stack ${APP_NAME}"
              exit 1
            fi

            echo "Services to verify:"
            echo "$SERVICES"

            FAILED=""

            for SERVICE in $SERVICES; do
              CONVERGED=0

              # Compare running replicas against the desired count declared by
              # the stack, so the check survives a change of scale.
              for i in {1..20}; do
                REPLICAS=$(docker service ls --filter "name=${SERVICE}" --format "{{.Replicas}}")
                RUNNING="${REPLICAS%%/*}"
                DESIRED="${REPLICAS##*/}"
                DESIRED="${DESIRED%% *}"

                if [[ -n "$RUNNING" && "$RUNNING" == "$DESIRED" && "$RUNNING" != "0" ]]; then
                  # A converged count can still include a task about to fail its
                  # healthcheck, so require the update itself to be complete.
                  STATE=$(docker service inspect "${SERVICE}" \
                    --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}none{{end}}' 2>/dev/null || echo "none")

                  if [[ "$STATE" == "none" || "$STATE" == "completed" ]]; then
                    echo "${SERVICE} deployed: $REPLICAS (update state: $STATE)"
                    CONVERGED=1
                    break
                  fi

                  # Only states known to be terminal fail the service; anything
                  # else is treated as still in flight so an unknown value cannot
                  # trigger a false rollback.
                  case "$STATE" in
                    paused|rollback_started|rollback_paused|rollback_completed)
                      echo "${SERVICE} update failed on the server (state: $STATE)"
                      break
                      ;;
                  esac

                  echo "Waiting for ${SERVICE} update to complete... ($REPLICAS, state: $STATE)"
                  sleep 5
                  continue
                fi

                echo "Waiting for ${SERVICE}... ($REPLICAS)"
                sleep 5
              done

              if [[ "$CONVERGED" != "1" ]]; then
                FAILED="${FAILED} ${SERVICE}"
                echo "=== ${SERVICE} did not converge ==="
                docker service ps --no-trunc "${SERVICE}" 2>&1 | head -20 || true
                docker service logs --tail 50 "${SERVICE}" 2>&1 | tail -50 || true
              fi
            done

            if [[ -n "$FAILED" ]]; then
              echo "Deployment failed for:${FAILED}"
              exit 1
            fi

            echo "All services deployed successfully"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP_NAME: ${{ vars.APP_NAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_NAME
          script: |
            echo "Rolling back deployment..."

            SERVICES=$(docker stack services "${APP_NAME}" --format '{{.Name}}')

            for SERVICE in $SERVICES; do
              REPLICAS=$(docker service ls --filter "name=${SERVICE}" --format "{{.Replicas}}")
              RUNNING="${REPLICAS%%/*}"
              DESIRED="${REPLICAS##*/}"
              DESIRED="${DESIRED%% *}"

              if [[ -n "$RUNNING" && "$RUNNING" == "$DESIRED" && "$RUNNING" != "0" ]]; then
                continue
              fi

              echo "Rolling back ${SERVICE} ($REPLICAS)"
              docker service rollback "${SERVICE}" || true
            done

  lighthouse:
    name: Lighthouse CI
    needs: [deploy]
    runs-on: ubuntu-latest
    environment: production
    if: always() && needs.deploy.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@fcd65974f7c4c2bf0ee9d09b84d2489183c29726 # v12
        continue-on-error: true
        with:
          urls: https://${{ vars.APP_DOMAIN }}
          configPath: .lighthouserc.cjs
