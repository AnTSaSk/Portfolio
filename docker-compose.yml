services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      NUXT_BASE_URL: https://${APP_DOMAIN:-alexisbesson.fr}
      # Public DSN (ships in the client bundle): feeds the server-side SDK, which
      # reads process.env. The client copy is inlined at build time via build-arg.
      NUXT_PUBLIC_SENTRY_DSN: ${NUXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Mirrors the build-args that already decided the script tag and the CSP:
      # kept here so the server-side runtimeConfig reports the same values.
      NUXT_PUBLIC_UMAMI_SRC: ${NUXT_PUBLIC_UMAMI_SRC:-}
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${NUXT_PUBLIC_UMAMI_WEBSITE_ID:-}
      NUXT_PUBLIC_UMAMI_DOMAINS: ${NUXT_PUBLIC_UMAMI_DOMAINS:-}
      # V8 heap ceiling below the container limit: libvips allocates off-heap, so
      # leave room or the kernel OOM-kills before V8 decides to collect
      NODE_OPTIONS: --max-old-space-size=288
    networks:
      - traefik-public
    deploy:
      # single-node Swarm: a 2nd replica shares the failure domain and doubles the
      # memory cost; start-first already covers zero-downtime deploys
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 10
        window: 120s
      resources:
        limits:
          memory: 512M
          cpus: '0.75'
        reservations:
          memory: 192M
          cpus: '0.1'
      labels:
        # Traefik routing
        - 'traefik.enable=true'
        - 'traefik.http.routers.${APP_NAME:-portfolio}.rule=Host(`${APP_DOMAIN:-alexisbesson.fr}`)'
        - 'traefik.http.routers.${APP_NAME:-portfolio}.entrypoints=websecure'
        - 'traefik.http.routers.${APP_NAME:-portfolio}.tls.certresolver=letsencrypt'
        - 'traefik.http.services.${APP_NAME:-portfolio}.loadbalancer.server.port=3000'
        # Health check
        - 'traefik.http.services.${APP_NAME:-portfolio}.loadbalancer.healthcheck.path=/health'
        - 'traefik.http.services.${APP_NAME:-portfolio}.loadbalancer.healthcheck.interval=30s'

        # Apply middlewares: compress (defined globally in Traefik), custom security headers + rate limiting
        # IMPORTANT: Custom middleware WITHOUT X-Robots-Tag to allow SEO indexing
        # The global security-headers middleware includes X-Robots-Tag: noindex
        # which would block search engines from indexing this public portfolio
        - 'traefik.http.routers.${APP_NAME:-portfolio}.middlewares=compress,${APP_NAME:-portfolio}-security,${APP_NAME:-portfolio}-ratelimit'

        # Middleware: Security headers (NO X-Robots-Tag, allows SEO indexing)
        - 'traefik.http.middlewares.${APP_NAME:-portfolio}-security.headers.stsSeconds=63072000'
        - 'traefik.http.middlewares.${APP_NAME:-portfolio}-security.headers.stsIncludeSubdomains=true'
        - 'traefik.http.middlewares.${APP_NAME:-portfolio}-security.headers.contentTypeNosniff=true'
        - 'traefik.http.middlewares.${APP_NAME:-portfolio}-security.headers.frameDeny=true'
        - 'traefik.http.middlewares.${APP_NAME:-portfolio}-security.headers.browserXssFilter=true'
        - 'traefik.http.middlewares.${APP_NAME:-portfolio}-security.headers.referrerPolicy=strict-origin-when-cross-origin'
        - 'traefik.http.middlewares.${APP_NAME:-portfolio}-security.headers.permissionsPolicy=accelerometer=(), ambient-light-sensor=(), autoplay=(), camera=(), document-domain=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), usb=()'
        # CSP adapted for Nuxt 3 SSR (unsafe-inline required for Vue hydration scripts and styles)
        # connect-src includes Sentry ingest endpoints for error reporting
        - "traefik.http.middlewares.${APP_NAME:-portfolio}-security.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.ingest.sentry.io https://*.sentry.io; frame-ancestors 'none'; form-action 'self'; base-uri 'self'"

        # Middleware: Rate limiting
        - 'traefik.http.middlewares.${APP_NAME:-portfolio}-ratelimit.ratelimit.average=100'
        - 'traefik.http.middlewares.${APP_NAME:-portfolio}-ratelimit.ratelimit.burst=50'
        - 'traefik.http.middlewares.${APP_NAME:-portfolio}-ratelimit.ratelimit.period=1s'

    # Security hardening - maximum isolation
    # NOTE: no-new-privileges is enforced at Docker daemon level (daemon.json)
    # security_opt is ignored by 'docker stack deploy' in Swarm mode
    cap_drop:
      - ALL
    read_only: true
    # service-level `tmpfs:` is silently dropped by `docker stack deploy`
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
          mode: 1777
      # must match NUXT_CONTENT_DB: @nuxt/content restores its SQLite dump here at
      # boot and creates tables lazily, so it stays written to for the process life
      # `mode`/`uid` are dropped by `docker stack deploy`; the mount inherits the
      # 1777 the Dockerfile sets on this directory
      - type: tmpfs
        target: /app/.data/content
        tmpfs:
          size: 33554432
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  styleguide:
    image: ghcr.io/${GITHUB_REPOSITORY}-styleguide:${IMAGE_TAG:-latest}
    networks:
      - traefik-public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 10
        window: 120s
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 16M
          cpus: '0.05'
      labels:
        # Traefik routing: internal Storybook, not indexed by search engines
        - 'traefik.enable=true'
        - 'traefik.http.routers.styleguide.rule=Host(`styleguide.alexisbesson.fr`)'
        - 'traefik.http.routers.styleguide.entrypoints=websecure'
        - 'traefik.http.routers.styleguide.tls.certresolver=letsencrypt'
        - 'traefik.http.services.styleguide.loadbalancer.server.port=8080'
        # Health check
        - 'traefik.http.services.styleguide.loadbalancer.healthcheck.path=/health'
        - 'traefik.http.services.styleguide.loadbalancer.healthcheck.interval=30s'

        # Apply middlewares: security headers (with noindex) + rate limiting
        - 'traefik.http.routers.styleguide.middlewares=compress,styleguide-security,styleguide-ratelimit'

        # Middleware: Security headers WITH X-Robots-Tag: noindex (Storybook must not be indexed)
        - 'traefik.http.middlewares.styleguide-security.headers.stsSeconds=63072000'
        - 'traefik.http.middlewares.styleguide-security.headers.stsIncludeSubdomains=true'
        - 'traefik.http.middlewares.styleguide-security.headers.contentTypeNosniff=true'
        - 'traefik.http.middlewares.styleguide-security.headers.frameDeny=true'
        - 'traefik.http.middlewares.styleguide-security.headers.browserXssFilter=true'
        - 'traefik.http.middlewares.styleguide-security.headers.referrerPolicy=strict-origin-when-cross-origin'
        - 'traefik.http.middlewares.styleguide-security.headers.customResponseHeaders.X-Robots-Tag=noindex'
        - "traefik.http.middlewares.styleguide-security.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'"

        # Middleware: Rate limiting
        - 'traefik.http.middlewares.styleguide-ratelimit.ratelimit.average=50'
        - 'traefik.http.middlewares.styleguide-ratelimit.ratelimit.burst=20'
        - 'traefik.http.middlewares.styleguide-ratelimit.ratelimit.period=1s'

    # Security hardening: read_only requires tmpfs for nginx runtime dirs
    cap_drop:
      - ALL
    read_only: true
    # service-level `tmpfs:` is silently dropped by `docker stack deploy`
    volumes:
      - type: tmpfs
        target: /var/cache/nginx
        tmpfs:
          size: 33554432
          mode: 1777
      - type: tmpfs
        target: /var/run
        tmpfs:
          size: 1048576
          mode: 1777
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216
          mode: 1777
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  traefik-public:
    external: true
