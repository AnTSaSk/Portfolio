packages:
    - 'packages/*'

allowBuilds:
    '@parcel/watcher': true
    '@sentry/cli': true
    better-sqlite3: true
    esbuild: true
    sharp: true
    unrs-resolver: true
    vue-demi: false

# Cross-platform sharp binaries for @nuxt/image IPX: build host (macOS) + Docker target (node:alpine = linux/musl)
supportedArchitectures:
    os:
        - current
        - linux
    cpu:
        - current
        - x64
        - arm64
    libc:
        - current
        - musl

catalog:
    '@types/node': 24.13.3
    '@vitest/coverage-v8': 4.1.10
    jsdom: 29.1.1
    vite: 8.1.4
    vitest: 4.1.10
    vue: 3.5.39
    vue-tsc: 3.3.7

minimumReleaseAgeExclude:
    - tsc-alias@1.9.1

overrides:
    '@vue/language-core': 3.3.7
    unhead: 2.1.15
    '@unhead/vue': 2.1.15
